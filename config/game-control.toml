profiles_dir = "/etc/game-control/profiles.d"
state_db = "/var/lib/game-control/state.db"
reservation_path = "/run/game-control/reservation.json"
# Keep boot_profile and boot_autostart at TOML root, before the first [section].
# The VM remains cold across controller restarts until an operator starts a profile.
boot_profile = "resume-last-active"
boot_autostart = false
# Active daily protected application backups use the fixed typed B2 destination.
[[schedule]]
# Avoid the modpack's own 03:00 UTC FTB backup/save-freeze window.
cron = "10 3 * * *"
profile = "minecraft-sunlit-cobblemon"
backup_destination = "horizon-b2"

[[schedule]]
cron = "20 3 * * *"
profile = "terraria-vanilla"
backup_destination = "horizon-b2"

[[schedule]]
cron = "40 3 * * *"
profile = "terraria-tmod"
backup_destination = "horizon-b2"

[stats]
exporter_url = "http://127.0.0.1:19565/metrics"
tps_interval_seconds = 30
log_checkpoint_dir = "/var/lib/game-control/log-checkpoints"

[rcon]
host = "127.0.0.1"
port = 25575
password_path = "/etc/game-control/secrets.d/minecraft-rcon-password"

# Horizon receives and exposes preset IDs only. The separate root-owned driver
# JSON owns JVM arguments and the isolated benchmark details.
[[benchmark]]
profile = "minecraft-sunlit-cobblemon"
driver = "/usr/local/libexec/swagbench-ab"
config = "/etc/game-control/swagbench.json"
report_root = "/srv/game-servers/minecraft-sunlit-benchmark/.horizon-reports"
timeout_seconds = 21600

[[benchmark.presets]]
id = "current"
label = "Current production"

[[benchmark.presets]]
id = "balanced-g1"
label = "Balanced G1 candidate"
