# Documentation-only H1/H2/G11 reference configuration.
# This file is not consumed by the baseline installer.
profiles_dir = "/etc/horizon-example/profiles.d"
state_db = "/var/lib/horizon-example/state.db"
reservation_path = "/run/horizon-example/reservation.json"
boot_profile = "resume-last-active"
boot_autostart = false

[[schedule]]
cron = "0 3 * * *"
profile = "minecraft-sunlit-cobblemon"
backup_destination = "example-b2"

[stats]
exporter_url = "http://127.0.0.1:19565/metrics"
tps_interval_seconds = 30

[rcon]
host = "127.0.0.1"
port = 25575
password_path = "/run/horizon-example/credentials/rcon-password"

[crafty]
base_url = "https://127.0.0.1:8443"
token_path = "/run/horizon-example/credentials/provider-token"
verify = true
