# Documentation-only LazyMC metadata example.
[public]
address = "192.0.2.10:25565"
version = "example"

[server]
address = "127.0.0.1:25566"
directory = "/etc/horizon-example/lazymc"
# LazyMC runs only the fixed Horizon wake/status helper. Horizon owns Java.
command = "/usr/local/libexec/horizon-example-lazymc-wake"
freeze_process = false
wake_on_start = false
wake_on_crash = false
probe_on_start = false
forge = true
start_timeout = 600
stop_timeout = 120
wake_whitelist = true
block_banned_ips = true

[time]
# Horizon owns player-aware idle stop; LazyMC must not stop the backend.
sleep_after = 4294967295
minimum_online_time = 600

[join]
methods = ["hold", "kick"]

[join.hold]
timeout = 25

[join.kick]
starting = "The server is starting. Please reconnect shortly."
stopping = "The server is stopping. Please reconnect later."

[lockout]
enabled = false

[rcon]
enabled = false

[advanced]
rewrite_server_properties = false
