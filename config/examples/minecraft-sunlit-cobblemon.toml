# Documentation-only intentional example profile.
id = "minecraft-sunlit-cobblemon"
display_name = "Sunlit Cobblemon"
adapter = "systemd"
systemd_unit = "minecraft-sunlit-cobblemon.service"
ports = [{ protocol = "tcp", port = 25566, required = true }]
start_timeout_seconds = 600
stop_timeout_seconds = 120
health_timeout_seconds = 600
idle_stop_minutes = 30
min_available_memory_bytes = 8589934592
min_free_disk_bytes = 16106127360
public_endpoint = { host = "mc.example.com", port = 25565, protocol = "tcp", relay_unit = "lazymc-minecraft.service" }
operations = ["start", "stop", "restart", "force_stop", "command", "backup", "restore", "update_check"]
notification_events = ["start", "stop", "failed_start", "crash", "forced_stop", "slot_conflict", "low_disk", "backup_failure", "update_failure", "idle_stop"]

[process]
executable = "/usr/bin/java"
argv_contains = ["@/opt/game-servers/minecraft-sunlit-cobblemon/libraries/example/unix_args.txt"]

[paths]
data_roots = ["/srv/game-servers/minecraft-sunlit-cobblemon", "/opt/game-servers/minecraft-sunlit-cobblemon"]
backup_roots = ["/srv/game-servers/minecraft-sunlit-cobblemon"]
mutable_root = "/srv/game-servers/minecraft-sunlit-cobblemon"
log_files = ["/srv/game-servers/minecraft-sunlit-cobblemon/logs/latest.log"]
backup_root = "/var/backups/game-servers/minecraft-sunlit-cobblemon"
install_root = "/opt/game-servers/minecraft-sunlit-cobblemon"
version_file = "/opt/game-servers/minecraft-sunlit-cobblemon/libraries/example/unix_args.txt"

[update]
kind = "manual"
