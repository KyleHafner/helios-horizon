id = "terraria-vanilla"
display_name = "Terraria Vanilla"
adapter = "systemd"
systemd_unit = "terraria-vanilla.service"
ports = [{ protocol = "tcp", port = 7777, required = true }]
start_timeout_seconds = 120
stop_timeout_seconds = 90
health_timeout_seconds = 120
min_available_memory_bytes = 2147483648
min_free_disk_bytes = 8589934592
public_endpoint = { host = "terraria.example.com", port = 7777, protocol = "tcp", relay_unit = "horizon-terraria-relay.service" }
operations = ["start", "stop", "restart", "force_stop", "command", "backup", "restore", "clone_source", "update_check"]
notification_events = ["start", "stop", "failed_start", "crash", "forced_stop", "slot_conflict", "low_disk", "backup_failure", "update_complete", "update_failure", "idle_stop"]

[process]
executable = "/opt/game-servers/terraria-vanilla/current/TerrariaServer.bin.x86_64"
argv_contains = ["-config", "/srv/game-servers/terraria-vanilla/config/serverconfig.txt"]
ready_log_pattern = "Server started"

[paths]
# Application backups contain mutable production state only. The pinned release
# under /opt is installed and recovered separately.
data_roots = ["/srv/game-servers/terraria-vanilla", "/opt/game-servers/terraria-vanilla"]
backup_roots = ["/srv/game-servers/terraria-vanilla"]
mutable_root = "/srv/game-servers/terraria-vanilla"
log_files = ["/srv/game-servers/terraria-vanilla/logs/server.log"]
backup_root = "/var/backups/game-servers/terraria-vanilla"
install_root = "/opt/game-servers/terraria-vanilla"
version_file = "/opt/game-servers/terraria-vanilla/current/version.txt"

[update]
kind = "release_symlink"
download_url = "https://terraria.org/api/download/pc-dedicated-server/terraria-server-1456.zip"
executable_relative_path = "TerrariaServer.bin.x86_64"
version_command = ["/opt/game-servers/terraria-vanilla/current/TerrariaServer.bin.x86_64", "-version"]
