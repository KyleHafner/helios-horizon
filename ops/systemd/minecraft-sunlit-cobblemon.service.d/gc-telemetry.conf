# Reversible Phase 1 GC observability layer; no collector, heap, or policy flags.
[Service]
Environment="JAVA_TOOL_OPTIONS=-Xlog:gc*:file=/srv/game-servers/minecraft-sunlit-cobblemon-current/logs/gc.log:time,uptime,level,tags:filecount=5,filesize=20M"

# Rollback: remove this drop-in, then run systemctl daemon-reload.
