[project]
name = "helios-game-control"
version = "0.1.0"
description = "Security-focused single-slot control plane for self-hosted game servers"
readme = "README.md"
license = "MIT"
authors = [{ name = "Kyle Hafner" }]
requires-python = ">=3.11"
keywords = ["fastapi", "game-server", "homelab", "linux", "systemd"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "psutil>=6.1,<7",
]

[project.urls]
Repository = "https://github.com/KyleHafner/helios-horizon"
Issues = "https://github.com/KyleHafner/helios-horizon/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/game_control"]

[project.optional-dependencies]
test = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1,<2",
  "playwright>=1.49,<2",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
