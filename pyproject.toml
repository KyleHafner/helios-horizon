[project]
name = "helios-game-control"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141.1,<1",
  "uvicorn[standard]>=0.52.4,<1",
  "pydantic>=2.13.5,<3",
  "httpx>=0.28.1,<1",
  "psutil>=7.2.2,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/game_control"]

[project.optional-dependencies]
test = [
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "playwright>=1.62.0,<2",
  "httpx2>=2.12.0,<3",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "hypothesis>=6.165.10,<7",
    "pytest-cov>=7.1.0",
]
