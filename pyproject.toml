[project]
name = "helios-game-control"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "psutil>=6.1,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
horizon = "game_control.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/game_control"]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "playwright>=1.49,<2",
  "httpx2>=2,<3",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "hypothesis>=6.131,<7",
    "pytest-cov>=7.1.0",
]
